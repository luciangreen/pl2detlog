name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-add-repository -y ppa:swi-prolog/stable && sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - run: swipl test/prolog/run_tests.pl
